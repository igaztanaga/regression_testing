# Boost regression tests, driven by the official run.py tool.
#
# Procedure documented at:
#   https://www.boost.org/doc/contributor-guide/testing/regression-tests.html
#
# Notes / constraints that shaped this file:
#
# * run.py is Python 2 only (it uses `print` statements and urllib.FancyURLopener),
#   so the job runs on ubuntu-22.04 -- the newest GitHub-hosted image on which a
#   python2 package can still be installed. Ubuntu 24.04 dropped Python 2.
#
# * run.py's default command, "regression", ends with "upload-logs", which
#   publishes results to the shared Boost result server. That is not what you
#   want from a personal CI, so this workflow spells out the commands explicitly
#   and stops before the upload:
#       get-tools get-source setup test-run collect-logs
#   The collected XML/ZIP is attached to the run as an artifact instead.
#
# * "test-run" is used instead of "test" so that run.py's Boost.Build test suite
#   step (command_test_boost_build) is skipped; it shells out to
#   tools/build/test/test_all.py and is fragile here.
#
# * --pjl-toolset=python makes run.py parse b2's --out-xml output directly
#   instead of first compiling the C++ process_jam_log utility.
#
# * A FULL run (every library, every test) fits neither GitHub's 6-hour job
#   limit nor its free disk space. The "libraries" input below therefore
#   defaults to a small set. Set it to an empty string to test everything, and
#   expect the job to be cut off.

name: Boost regression tests

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - feature/**
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch to test'
        type: choice
        options: [develop, master]
        default: develop
      libraries:
        description: 'Comma-separated libraries to test (empty = all; will likely exceed the 6h limit)'
        type: string
        default: 'config,core,smart_ptr'
      bjam_options:
        description: 'Extra options passed through to b2 (e.g. "variant=release cxxstd=17")'
        type: string
        default: ''
      timeout:
        description: 'Per-test timeout, in minutes'
        type: string
        default: '10'
      fail_on_test_failure:
        description: 'Mark the job red if any test failed'
        type: boolean
        default: false
  schedule:
    # Nightly, 02:30 UTC.
    - cron: '30 2 * * *'

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUN_PY_URL: https://raw.githubusercontent.com/boostorg/regression/develop/testing/src/run.py
  # run.py takes its working root from the directory it sits in.
  REG_ROOT: ${{ github.workspace }}/regression
  TAG: ${{ inputs.tag || 'develop' }}
  LIBRARIES: ${{ inputs.libraries || 'config,core,smart_ptr' }}
  EXTRA_BJAM_OPTIONS: ${{ inputs.bjam_options || '' }}
  TEST_TIMEOUT: ${{ inputs.timeout || '10' }}

jobs:
  regression:
    name: ${{ matrix.toolset }}
    # ubuntu-22.04 is required: it is the last image with an installable python2.
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: gcc-11
            packages: g++-11
            using: 'using gcc : 11 : g++-11 ;'
          - toolset: clang-14
            packages: clang-14
            using: 'using clang : 14 : clang++-14 ;'

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Reclaim disk space
        run: |
          set -euo pipefail
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          echo "After:"; df -h /

      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # python2 is the interpreter run.py needs; python2.7 is the fallback
          # package name on older archives.
          sudo apt-get install -y --no-install-recommends \
            python2 git ${{ matrix.packages }} \
            || sudo apt-get install -y --no-install-recommends \
                 python2.7 git ${{ matrix.packages }}
          python2 --version
          git --version

      - name: Configure the toolset for Boost.Build
        run: |
          set -euo pipefail
          # run.py has no option to point b2 at a specific compiler binary, so
          # declare it in the user-config.jam that b2 reads from $HOME.
          echo '${{ matrix.using }}' > "$HOME/user-config.jam"
          cat "$HOME/user-config.jam"

      - name: Set up the regression root
        run: |
          set -euo pipefail
          # "results" is normally created by run.py's "test" command; we invoke
          # "test-run" directly, so create it here.
          mkdir -p "$REG_ROOT/results"
          cd "$REG_ROOT"
          curl -fsSL -o run.py "$RUN_PY_URL"

          # Shown on the runner's page in the Boost-wide reports. Optional --
          # run.py writes a bland placeholder if it is missing.
          if [ -f "$GITHUB_WORKSPACE/repo/comment.html" ]; then
            cp "$GITHUB_WORKSPACE/repo/comment.html" comment.html
          else
            cat > comment.html <<EOF
          <p>GitHub Actions runner, image ubuntu-22.04, toolset ${{ matrix.toolset }}.</p>
          <p>Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
          EOF
          fi

          # run.py executes ./patch_boost after fetching the sources, if present.
          if [ -f "$GITHUB_WORKSPACE/repo/patch_boost" ]; then
            cp "$GITHUB_WORKSPACE/repo/patch_boost" patch_boost
            chmod +x patch_boost
          fi

      - name: Run the regression tests
        run: |
          set -euo pipefail
          cd "$REG_ROOT"

          BJAM_OPTIONS="-j$(nproc) $EXTRA_BJAM_OPTIONS"

          ARGS=(
            --runner="${{ github.repository_owner }}-gha-${{ matrix.toolset }}"
            --tag="$TAG"
            --toolsets="${{ matrix.toolset }}"
            --pjl-toolset=python
            --timeout="$TEST_TIMEOUT"
            --bjam-options="$BJAM_OPTIONS"
          )
          if [ -n "$LIBRARIES" ]; then
            ARGS+=( --libraries="$LIBRARIES" )
          fi

          # Deliberately no "upload-logs": results stay in this repository.
          python2 run.py "${ARGS[@]}" \
            get-tools get-source setup test-run collect-logs

      - name: Summarize results
        if: always()
        env:
          TOOLSET: ${{ matrix.toolset }}
        run: |
          set -uo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os, sys
          import xml.etree.ElementTree as ET

          root = os.environ['REG_ROOT']
          # bjam.xml is b2's raw log; the runner-named file is the collected report.
          reports = [p for p in glob.glob(os.path.join(root, 'results', '*.xml'))
                     if os.path.basename(p) != 'bjam.xml']

          print('## %s' % os.environ.get('TOOLSET', 'results'))
          print('')
          if not reports:
              print('No result file was produced -- the run did not reach collect-logs.')
              sys.exit(0)

          passed, failed = 0, []
          for path in reports:
              try:
                  tree = ET.parse(path)
              except ET.ParseError as e:
                  print('Could not parse `%s`: %s' % (os.path.basename(path), e))
                  continue
              for log in tree.getroot().iter('test-log'):
                  stages = [c.tag for c in log if c.get('result') == 'fail']
                  name = '%s/%s' % (log.get('library', '?'), log.get('test-name', '?'))
                  if stages:
                      failed.append((name, ', '.join(stages)))
                  else:
                      passed += 1

          print('| passed | failed |')
          print('| ---: | ---: |')
          print('| %d | %d |' % (passed, len(failed)))
          if failed:
              print('')
              print('### Failures')
              print('')
              print('| test | failing stage |')
              print('| --- | --- |')
              for name, stages in sorted(failed):
                  print('| `%s` | %s |' % (name, stages))

          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write('TESTS_FAILED=%d\n' % len(failed))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.toolset }}
          path: |
            regression/results/*.xml
            regression/results/*.zip
            regression/*comment.html
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if any test failed
        if: always() && inputs.fail_on_test_failure
        run: |
          if [ "${TESTS_FAILED:-0}" -ne 0 ]; then
            echo "::error::${TESTS_FAILED} test(s) failed"
            exit 1
          fi
